# Builds the API image on GitHub's machines (amd64 and arm64) and publishes it
# to GitHub Container Registry, so a small server only has to pull it.
name: api-image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vinu0404/bitcode-api:latest
            ghcr.io/vinu0404/bitcode-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/vinu0404/bitcode
          cache-from: type=gha
          cache-to: type=gha,mode=max
