# Calls the API's /ready every 10 minutes. /ready runs a real database query,
# so this keeps the free Supabase project from pausing after a week of
# inactivity. A failed run (server down, database or iverilog unhealthy) makes
# GitHub email the repo owner, so it doubles as a free uptime alert.
# Set a repository variable API_URL to change the address without editing this file.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check /ready
        env:
          API_URL: ${{ vars.API_URL || 'https://130-210-86-140.sslip.io' }}
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 "$API_URL/ready")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
